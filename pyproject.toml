[project]
name = "coxit-test-task"
version = "0.1.0"
description = "Approximate 2D room layout from a 3D floor-plan render with classical CV"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.16.2",
    "opencv-python-headless>=5.0.0.93",
    "python-dotenv>=1.2.3",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
]
